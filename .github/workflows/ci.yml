name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v --tb=short

  # The `test` job above never spawns a subprocess, never installs the wheel and
  # never loads a real embedding model, because it runs the source tree in-process
  # against a mock backend. Two shipped defects lived in exactly that blind spot:
  # 0.2.0 went out with a server that could not start, and a declared `mcp>=1.14`
  # floor survived two releases even though loading the model inside a 1.x stdio
  # server kills it. This job is slower than the rest of CI on purpose — it is the
  # only one that exercises the artifact users actually receive.
  e2e-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKILL_MCP_DATA_DIR: /tmp/skill-mcp-e2e
    steps:
      - uses: actions/checkout@v4

      # The declared floor, not the newest interpreter: a packaging problem is
      # likeliest at the oldest version we promise to support.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        run: |
          set -o pipefail
          python -m venv /tmp/e2e
          # The pip bundled inside a 3.10 venv is 23.0.1, which discards any wheel
          # whose metadata spells its own name differently from the request
          # (`Jinja2` vs `jinja2`), falls back to the sdist and then fails to build
          # it. Name normalisation was fixed upstream years ago.
          /tmp/e2e/bin/pip install --upgrade pip
          # sentence-transformers pulls torch, and the default wheel carries the
          # whole CUDA runtime for a job that will only ever run on CPU.
          /tmp/e2e/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tee /tmp/pip-torch.log
          /tmp/e2e/bin/pip install "$(ls dist/*.whl)[local]" 2>&1 | tee /tmp/pip-wheel.log

      # Run logs are admin-only over the REST API, so an install failure here is
      # invisible to anything driving CI from a script. Annotations are not.
      - name: Surface the install failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os, pathlib
          out = [os.popen("/tmp/e2e/bin/pip -V").read().strip(),
                 os.popen("df -h /").read().strip().splitlines()[-1]]
          for name in ("pip-torch.log", "pip-wheel.log"):
              p = pathlib.Path("/tmp") / name
              if not p.exists():
                  out.append(f"--- {name}: not written ---")
                  continue
              tail = p.read_text(errors="replace").splitlines()[-60:]
              out.append(f"--- {name} (last {len(tail)} lines) ---")
              out.extend(tail)
          msg = "\n".join(out).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::{msg}")
          PY

      - name: Build a store and index with a real embedding model
        run: |
          /tmp/e2e/bin/skill-mcp init --no-register
          /tmp/e2e/bin/skill-mcp import --source directory --path tests/e2e/corpus --no-index
          /tmp/e2e/bin/skill-mcp build-index

      - name: Drive it over real MCP stdio
        run: /tmp/e2e/bin/python tests/e2e/stdio_smoke.py /tmp/e2e/bin/skill-mcp "$SKILL_MCP_DATA_DIR"

  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
