[build-system]
# 77 is the floor: `license` as a bare SPDX expression and `license-files` are
# PEP 639 keys, which older setuptools does not understand.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-retrieval-mcp"
version = "0.3.0"
description = "Lightweight MCP Server for RAG-based skill retrieval"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Zhan Cheng", email = "zcheng256@gmail.com"},
]
keywords = ["mcp", "skill-retrieval", "rag", "ai-agents", "faiss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # 2.0 is the floor because semantic search does not survive below it: on
    # mcp 1.14 the stdio server dies without a traceback the first time
    # search_skills loads the embedding model, while keyword_search and the
    # non-MCP `skill-mcp search` path both work. Root cause never found.
    "mcp>=2.0",
    "pydantic>=2.11",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "click>=8.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # `init` parses Codex's config.toml to decide whether our table can be
    # appended, and tomllib only became stdlib in 3.11. Without this, that one
    # step of `init` degrades to printing a snippet for the user to paste.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/JayCheng113/skill-retrieval-mcp"
Repository = "https://github.com/JayCheng113/skill-retrieval-mcp"
Issues = "https://github.com/JayCheng113/skill-retrieval-mcp/issues"

[project.optional-dependencies]
openai = ["openai>=1.50", "tiktoken>=0.7"]
local = ["sentence-transformers>=3.0"]
ollama = ["httpx>=0.27"]
hf = ["huggingface-hub>=0.20"]
sse = ["starlette>=0.27", "uvicorn>=0.20"]
all = ["openai>=1.50", "tiktoken>=0.7", "sentence-transformers>=3.0", "httpx>=0.27", "huggingface-hub>=0.20", "starlette>=0.27", "uvicorn>=0.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.3"]

[project.scripts]
skill-mcp = "skill_mcp.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned explicitly: ruff's implicit default rule set has grown over time, so
# leaving it unset makes CI fail on lint findings that arrive with a ruff bump
# rather than with a code change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
