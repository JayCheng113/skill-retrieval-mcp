[build-system]
# 77 is the floor: `license` as a bare SPDX expression and `license-files` are
# PEP 639 keys, which older setuptools does not understand.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-retrieval-mcp"
version = "0.2.0"
description = "Lightweight MCP Server for RAG-based skill retrieval"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Zhan Cheng", email = "zcheng256@gmail.com"},
]
keywords = ["mcp", "skill-retrieval", "rag", "ai-agents", "faiss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # 1.14 is the floor: earlier releases crash in Tool.from_function on
    # Annotated[...] parameters (issubclass on a non-class annotation).
    # There is no upper cap: the server uses the FastMCP-style decorator API,
    # which mcp 2.x kept. The suite and the end-to-end stdio client both run
    # green on 2.0.
    "mcp>=1.14",
    "pydantic>=2.11",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "click>=8.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/JayCheng113/skill-retrieval-mcp"
Repository = "https://github.com/JayCheng113/skill-retrieval-mcp"
Issues = "https://github.com/JayCheng113/skill-retrieval-mcp/issues"

[project.optional-dependencies]
openai = ["openai>=1.50", "tiktoken>=0.7"]
local = ["sentence-transformers>=3.0"]
ollama = ["httpx>=0.27"]
hf = ["huggingface-hub>=0.20"]
sse = ["starlette>=0.27", "uvicorn>=0.20"]
all = ["openai>=1.50", "tiktoken>=0.7", "sentence-transformers>=3.0", "httpx>=0.27", "huggingface-hub>=0.20", "starlette>=0.27", "uvicorn>=0.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.3"]

[project.scripts]
skill-mcp = "skill_mcp.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned explicitly: ruff's implicit default rule set has grown over time, so
# leaving it unset makes CI fail on lint findings that arrive with a ruff bump
# rather than with a code change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
